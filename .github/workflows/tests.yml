name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: ${{ runner.temp }}/gcs-mpl
      SUNPY_CONFIGDIR: ${{ runner.temp }}/gcs-sunpy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libopenjp2-7
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare isolated application caches
        run: mkdir -p "$MPLCONFIGDIR" "$SUNPY_CONFIGDIR"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check the frozen reference run
        run: python scripts/check_reference_run.py
